version: 2
updates:
  # Application dependencies (npm/pnpm).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Keep GitHub Actions pinned/updated (supports SHA-pinning automation, doc 03).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
