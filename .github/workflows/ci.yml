name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token (anti-clone doc 03): read-only by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # The ephemeral-DB harness (scripts/with-ephemeral-db.mjs) needs initdb,
      # pg_ctl and psql. On ubuntu runners PostgreSQL is installed but its binaries
      # live under /usr/lib/postgresql/<ver>/bin, which is NOT on PATH (Rev 05 §2).
      # Put the newest one on PATH (installing the client/server if somehow absent)
      # and prove the tools resolve before any DB E2E runs.
      - name: Ensure PostgreSQL tooling (initdb/pg_ctl/psql) on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$PGBIN" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client
            PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/initdb" --version
          "$PGBIN/pg_ctl" --version
          "$PGBIN/psql" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format + lint + typecheck + build + unit tests (includes the production
      # fail-closed invariants and the media/authz unit specs).
      - name: Check (format, lint, typecheck, build, unit)
        run: pnpm run check

      # Each of these spins its own ephemeral Postgres via scripts/with-ephemeral-db.mjs.
      - name: E2E (data core — permissions, outbox, audit)
        run: pnpm run test:e2e

      - name: E2E (auction engine — concurrency, soft-close, winner)
        run: pnpm run test:auction

      # Commercial Offer Engine V2 (Evolution E4) — the money-critical negotiation +
      # sealed-award path: append-only revisions, atomic accept (concurrent burst → one
      # Sale), sealed confidentiality (no pre-reveal leak), and DECISIONS D4 (the highest
      # sealed proposal never auto-awards; AUTO_HIGHEST only when explicitly configured).
      - name: E2E (commercial offers — revisions, atomic accept, sealed D4)
        run: pnpm run test:offers

      # Currency / FX (Evolution E5) — informational display conversion (never binding, D5),
      # float-free exact math, and rate-snapshot persistence + cache reuse (Google adapter D12,
      # fake in CI).
      - name: E2E (currency / FX — display conversion, snapshot cache)
        run: pnpm run test:fx

      # Transaction Routing + two-layer Terms (Evolution E6) — the deterministic, explainable,
      # versioned resolution of operator/payment-route/terms/verification (or
      # MANUAL_REVIEW_REQUIRED), most-specific-rule wins, unverified config is a non-binding
      # preview (D7), and decision snapshots persist.
      - name: E2E (transaction routing — deterministic resolution, D7 gating)
        run: pnpm run test:routing

      # Logistics / Ports / Incoterms (Evolution E7) — the Incoterm taxonomy, deterministic
      # float-free instant freight estimates, freight responsibility from the Incoterm, and a
      # quote that is not a booking (persisted assumptions + expiry). Fake provider in CI (O6).
      - name: E2E (logistics — Incoterms, deterministic quote engine)
        run: pnpm run test:logistics

      # Fees / Tax rules engine (Evolution E8) — versioned, deterministic, float-free charge
      # breakdown (premium + fee + tax-on-subtotal + seller commission), most-specific rule per
      # component, reproducible per-line applied rules, and unverified tax → non-binding preview.
      - name: E2E (fees / tax — deterministic breakdown, reproducibility, O3 preview)
        run: pnpm run test:fees

      # Payment orchestration (Evolution E8b) — deterministic regulated-route resolution (external
      # providers only; unverified → MANUAL_REVIEW per O4) + signed, idempotent webhook intake.
      - name: E2E (payments — regulated route resolution, signed idempotent webhooks)
        run: pnpm run test:payments

      # Procurement / reverse-tender (Evolution E9, pack doc 09) — the buyer-initiated two-sided
      # market: RFQ / Request-Supply / reverse-tender, cheapest-first ranking as a recommendation
      # ONLY, ownership-gated close/award/view, and a buyer-explicit award that never auto-selects
      # the cheapest (§09 / D4).
      - name: E2E (procurement — reverse tender, ranked recommendation, explicit award)
        run: pnpm run test:procurement

      # Supply Programmes + perishable goods (Evolution E10, pack doc 09 §Supply Programme + owner
      # reqs 23/24) — recurring availability, transition-guarded lifecycle, buyer-side matching that
      # ranks cheapest-first as a RECOMMENDATION only (never an auto-award, §09 / D4), and perishable
      # metadata with date/temperature validation + automatic-expiry predicate.
      - name: E2E (supply — recurring programmes, advisory matching, perishable expiry)
        run: pnpm run test:supply

      # Singha ID (Evolution E11, pack doc 11 §Singha ID) — one geography-neutral member profile +
      # capability-based verification: browse-class activities are open, a gated activity requires a
      # verified/unexpired capability an operator grants (O7 governs the evidence bar), non-pending
      # decisions 409, expired grants stop permitting.
      - name: E2E (singha-id — profile + capability-based verification)
        run: pnpm run test:singha-id

      # Unified Dashboard + operator Control Centre (Evolution E11b, pack doc 11) — read-only
      # projections: a member's cross-domain command centre (Buying/Selling/Verification) and the
      # operator-scoped admin overview (config + record counts + attention alerts, operate-gated,
      # operatorCode-scoped).
      - name: E2E (dashboard — member command centre + operator control centre)
        run: pnpm run test:dashboard

      # Singha Intelligence expansion (Evolution E12, pack doc 12 §AI) — DETERMINISTIC matching,
      # offer/pricing comparison and fraud/risk scoring. Every output is a derived, non-binding
      # recommendation (no LLM binds; deterministic code owns money/eligibility/state) and is
      # persisted as an append-only IntelligenceReport.
      - name: E2E (insight — deterministic matching / pricing / offer / risk intelligence)
        run: pnpm run test:insight

      # RW2 photo-first AI seller intake (docs/10) — the advisory vision draft is a DERIVED AiRun
      # (per-field provenance + honest capture coach + evidence-based valuation) that mutates NO
      # asset/listing fact, applies the SAME AI boundary guard to free-text notes, and is ai:use
      # gated on the server. Provider-neutral (mock until PROVIDER_GATED activation).
      - name: E2E (vision — advisory photo-first seller intake, derived + guarded)
        run: pnpm run test:vision

      # Auction stress matrix (A–J + privacy + scaled concurrency + soft-close) — the full
      # scenario set against the authoritative engine, in ISOLATED run-scoped auctions so the
      # append-only bid ledger is never entangled. Bid privacy (no proxy-max/reserve/internal-id
      # leak) is a mandatory gate here.
      - name: E2E (auction stress — A–J, privacy, 5/10/25 concurrency, soft-close)
        run: pnpm run test:auction-stress

      # RW3 secure media pipeline (docs/06; FIX-03..07) — per-kind MIME allowlist + size caps at
      # upload-grant AND registration, a provider-neutral malware scanner gate for documents/video
      # (ClamAV isolated daemon in prod, PROVIDER_GATED), and an authorized time-limited download
      # URL that object-level authorizes the caller (private-media IDOR guard).
      - name: E2E (media — upload policy, authorized download, IDOR guard)
        run: pnpm run test:media

      # Seller Studio persistence (directive §25/§7) — server-resumable drafts (owner-scoped,
      # optimistic-concurrency conflict on save) + structurally-persisted, staff-approvable auction
      # preferences (owner-set, never the authoritative auction).
      - name: E2E (seller-studio — resumable drafts + auction preferences)
        run: pnpm run test:seller-studio

      # §20 (RW9) inspection/certification evidence — staff-only attach (asset:manage), the
      # provider-port seam (requested + inspectionId, never a fabricated certificate), and the
      # customer-safe lot-detail projection (PUBLIC evidence only; private docs/ids never leak).
      - name: E2E (inspection evidence — staff attach + customer-safe projection)
        run: pnpm run test:inspection-evidence

      # §21/§22 (RW6) Singha Live floor state-machine — scoped auctioneer/clerk/producer roles, the
      # per-lot state machine + current-lot pointer + sequencing, the authoritative-engine floor read
      # (rule 12), and the deterministic fake stream.
      - name: E2E (live floor — auctioneer state machine + scoped roles)
        run: pnpm run test:live-floor

      # Satellite Market Node + SEO (Evolution E13, pack Addendum A + doc 11) — the two node modes,
      # the non-negotiable central-ledger invariant (a node-originated listing is the SAME central
      # canonical record; origination is attribution, gated by mode/capability/verification), and the
      # deterministic SEO helpers (canonical strips display currency, hreflang, JSON-LD).
      - name: E2E (satellite node — central-ledger invariant + SEO)
        run: pnpm run test:node

      # Member identity, credit, security & performance engine (Revision 05):
      # Client ID uniqueness, configurable 5% rule, verified/expired security,
      # concurrency-safe credit reservation (no over-commit), temporary onsite
      # grant, deterministic performance, and flag/score privacy.
      - name: E2E (member — Client ID, credit exposure, security, performance)
        run: pnpm run test:member

      - name: E2E (crm — staff notes + tasks/follow-ups, RBAC, append-only)
        run: pnpm run test:crm

      # Singha Connect + Agent Inbox (CRM completion pass §4): verified-identity
      # inbound resolution, threaded messages, AI↔human handoff, the staff inbox
      # (filters + SLA + assign + resolve + reopen), the advisory-only AI reply
      # suggestion (sends nothing), and the two-step channel bid intent→confirm.
      - name: E2E (connect — Agent Inbox, handoff, channel bid intent)
        run: pnpm run test:connect

      # MANDATORY security gate (pack P1 #13): the P0 negative regression suite —
      # privacy, media IDOR, storage integrity, AAL2/MFA and public-state leakage.
      # A regression here fails the build.
      - name: Security regression suite (S01–S23)
        run: pnpm run test:security

      # Catalogue scale acceptance (pack 01 doc 05): 2000-lot Rubik reachability +
      # DB-side facets + no full-inventory download.
      - name: Catalogue scale acceptance
        run: pnpm run test:scale

      # Durable seller-org attribution + migration safety (pack 01 docs 09/11):
      # attribution survives membership changes; backfill preserves data.
      - name: Seller-org durability + migration safety
        run: pnpm run test:seller-org

      # Public API contract gate (pack 01 doc 08): fails if a public response
      # drifted from contracts/public-api.contract.json (the shape the frontend
      # validates its DTOs against). Neither side can drift silently.
      - name: Public API contract check
        run: pnpm run contract:check
