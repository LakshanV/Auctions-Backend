name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # The ephemeral-DB harness (scripts/with-ephemeral-db.mjs) needs initdb,
      # pg_ctl and psql. On ubuntu runners PostgreSQL is installed but its binaries
      # live under /usr/lib/postgresql/<ver>/bin, which is NOT on PATH (Rev 05 §2).
      # Put the newest one on PATH (installing the client/server if somehow absent)
      # and prove the tools resolve before any DB E2E runs.
      - name: Ensure PostgreSQL tooling (initdb/pg_ctl/psql) on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$PGBIN" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client
            PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/initdb" --version
          "$PGBIN/pg_ctl" --version
          "$PGBIN/psql" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format + lint + typecheck + build + unit tests (includes the production
      # fail-closed invariants and the media/authz unit specs).
      - name: Check (format, lint, typecheck, build, unit)
        run: pnpm run check

      # Each of these spins its own ephemeral Postgres via scripts/with-ephemeral-db.mjs.
      - name: E2E (data core — permissions, outbox, audit)
        run: pnpm run test:e2e

      - name: E2E (auction engine — concurrency, soft-close, winner)
        run: pnpm run test:auction

      # Member identity, credit, security & performance engine (Revision 05):
      # Client ID uniqueness, configurable 5% rule, verified/expired security,
      # concurrency-safe credit reservation (no over-commit), temporary onsite
      # grant, deterministic performance, and flag/score privacy.
      - name: E2E (member — Client ID, credit exposure, security, performance)
        run: pnpm run test:member

      # MANDATORY security gate (pack P1 #13): the P0 negative regression suite —
      # privacy, media IDOR, storage integrity, AAL2/MFA and public-state leakage.
      # A regression here fails the build.
      - name: Security regression suite (S01–S23)
        run: pnpm run test:security

      # Catalogue scale acceptance (pack 01 doc 05): 2000-lot Rubik reachability +
      # DB-side facets + no full-inventory download.
      - name: Catalogue scale acceptance
        run: pnpm run test:scale

      # Durable seller-org attribution + migration safety (pack 01 docs 09/11):
      # attribution survives membership changes; backfill preserves data.
      - name: Seller-org durability + migration safety
        run: pnpm run test:seller-org

      # Public API contract gate (pack 01 doc 08): fails if a public response
      # drifted from contracts/public-api.contract.json (the shape the frontend
      # validates its DTOs against). Neither side can drift silently.
      - name: Public API contract check
        run: pnpm run contract:check
