name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC

# Least-privilege token (anti-clone doc 03).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaked secrets in old commits are found
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action@v2 refuses to scan pull_request events without a token
          # (breaking change); the default GITHUB_TOKEN + contents:read above is
          # sufficient for the scan. No org licence key is needed for an individual user.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
